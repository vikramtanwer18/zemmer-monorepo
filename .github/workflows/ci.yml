name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same development credentials as docker-compose.yml / .env.example; throwaway services.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gym_owner
          POSTGRES_PASSWORD: gym_owner_dev_pw
          POSTGRES_DB: gym
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym_owner -d gym"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cp .env.example .env

      - name: Create database roles
        run: psql -v ON_ERROR_STOP=1 -h localhost -U gym_owner -d gym -f infra/postgres/01-roles.sql
        env:
          PGPASSWORD: gym_owner_dev_pw

      - run: pnpm db:deploy

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm build

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same development credentials as docker-compose.yml / .env.example; throwaway services.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gym_owner
          POSTGRES_PASSWORD: gym_owner_dev_pw
          POSTGRES_DB: gym
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym_owner -d gym"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Sign-up verification and OTP emails are read from Mailpit by the e2e tests.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cp .env.example .env

      - name: Create database roles
        run: psql -v ON_ERROR_STOP=1 -h localhost -U gym_owner -d gym -f infra/postgres/01-roles.sql
        env:
          PGPASSWORD: gym_owner_dev_pw

      - run: pnpm db:deploy

      - run: pnpm --filter web exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/*/playwright-report
          retention-days: 7
