# Local development services. Start with `pnpm services:up`, stop with `pnpm services:down`.
# Passwords here are development-only and match .env.example.
name: gym-saas

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: gym_owner
      POSTGRES_PASSWORD: gym_owner_dev_pw
      POSTGRES_DB: gym
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 keeps data in a versioned folder under /var/lib/postgresql.
      - postgres-data:/var/lib/postgresql
      # Runs once, when the volume is first created.
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_owner -d gym"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # The official minio/minio image is no longer published on Docker Hub; Chainguard builds it from source.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: gym_minio
      MINIO_ROOT_PASSWORD: gym_minio_dev_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    # Same image: it ships the mc client and a shell.
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 gym_minio gym_minio_dev_pw &&
      mc mb --ignore-existing local/gym-dev-uploads
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
